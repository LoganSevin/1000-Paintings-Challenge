# Free public URL (included with Netlify — no domain purchase):
#   https://1000-l7in.netlify.app/

[build]
  command = "npm install"
  publish = "."
  # Deploy gate: every production deploy costs 15 Netlify credits, so pushes to
  # main only build when the commit message contains [deploy] (put it in the
  # squash-merge title or body). Deploy Previews / branch deploys always build.
  # To ship without a code change: push an empty commit whose message has
  # [deploy], or use a build hook (hooks bypass this check).
  ignore = "node ./scripts/netlify-ignore.js"

[[redirects]]
  from = "/subscribe"
  to = "/subscribe.html"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."generate-stasis-vision"]
  timeout = 120

[functions."blend-spells"]
  timeout = 60

[functions."redefine-stasis"]
  timeout = 60

[functions."transfer-upload"]
  timeout = 90

[functions."transfer"]
  timeout = 90

[functions."cameo-video"]
  timeout = 60

[functions."animate-cast"]
  timeout = 60

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

