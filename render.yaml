# Optional: host Spellforge API (blend + stasis image) on Render.
# Static site: deploy gallery/ to Netlify (deploy_live.bat).
# Then set Spellforge API URL in index.html or use same Render service for both.

services:
  - type: web
    name: paintings-gallery-api
    runtime: python
    plan: free
    # Repo root must be the gallery folder (index.html + scripts/ + paintings/)
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/app_server.py
    envVars:
      - key: XAI_API_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      # Render injects PORT automatically; app_server.py reads it
    healthCheckPath: /api/health